{% load i18n %}<span class="sc-badge sc-badge-{{ status }}">{% if status == "applied" %}<i class="bi bi-check2-circle" aria-hidden="true"></i>{% elif status == "modification_requested" %}<i class="bi bi-arrow-repeat" aria-hidden="true"></i>{% elif status == "paused" %}<i class="bi bi-pause-circle" aria-hidden="true"></i>{% elif status == "disabled" %}<i class="bi bi-slash-circle" aria-hidden="true"></i>{% else %}<i class="bi bi-hourglass-split" aria-hidden="true"></i>{% endif %}{{ label }}</span>
