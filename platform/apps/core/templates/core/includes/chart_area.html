{% load i18n %}<figure class="sc-chart" data-chart data-crosshair tabindex="0" aria-label="{{ title }}" aria-describedby="{{ chart_id }}-hint">
  <span class="sc-chart-ymax" aria-hidden="true">{{ chart.ymax }}</span>
  <svg class="sc-chart-svg" viewBox="0 0 {{ chart.width }} {{ chart.height }}" aria-hidden="true" focusable="false">
    <line class="sc-chart-grid" x1="0" x2="{{ chart.width }}" y1="1" y2="1"></line>
    <line class="sc-chart-base" x1="0" x2="{{ chart.width }}" y1="{{ chart.height }}" y2="{{ chart.height }}"></line>
    <path class="sc-area" d="{{ chart.area }}"></path>
    <path class="sc-line" d="{{ chart.line }}"></path>
    <line class="sc-crosshair" x1="0" x2="0" y1="0" y2="{{ chart.height }}"></line>
    <circle class="sc-dot" cx="{{ chart.end_x }}" cy="{{ chart.end_y }}" r="4"></circle>
    {% for p in chart.points %}<rect class="sc-hit" x="{{ p.hit_x }}" y="0" width="{{ p.hit_width }}" height="{{ chart.height }}" data-index="{{ forloop.counter0 }}" data-x="{{ p.x }}" data-tip="{{ p.tip }}"></rect>{% endfor %}
  </svg>
  <div class="sc-chart-axis is-ends" aria-hidden="true"><span>{{ chart.points.0.label }}</span><span>{% with last=chart.points|last %}{{ last.label }}{% endwith %}</span></div>
  <p class="visually-hidden" id="{{ chart_id }}-hint">{% translate "Use the left and right arrow keys to read each value." %}</p>
  <details class="sc-chart-table"><summary>{% translate "See the data" %}</summary>
    <table class="table table-sm"><caption class="visually-hidden">{{ title }}</caption>
      <tbody>{% for p in chart.points %}<tr><th scope="row">{{ p.label }}</th><td class="text-end">{{ p.value }}</td></tr>{% endfor %}</tbody>
    </table>
  </details>
</figure>
