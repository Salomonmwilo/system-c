{% load i18n %}<figure class="sc-chart" data-chart tabindex="0" aria-label="{{ title }}" aria-describedby="{{ chart_id }}-hint">
  <span class="sc-chart-ymax" aria-hidden="true">{{ chart.ymax }}</span>
  <svg class="sc-chart-svg" viewBox="0 0 {{ chart.width }} {{ chart.height }}" aria-hidden="true" focusable="false">
    <line class="sc-chart-grid" x1="0" x2="{{ chart.width }}" y1="1" y2="1"></line>
    <line class="sc-chart-base" x1="0" x2="{{ chart.width }}" y1="{{ chart.height }}" y2="{{ chart.height }}"></line>
    {% for bar in chart.bars %}{% if bar.path %}<path class="sc-bar{% if bar.current %} is-current{% endif %}" d="{{ bar.path }}" data-index="{{ forloop.counter0 }}"></path>{% endif %}{% endfor %}
    {% for bar in chart.bars %}<rect class="sc-hit" x="{{ bar.hit_x }}" y="0" width="{{ bar.hit_width }}" height="{{ chart.height }}" data-index="{{ forloop.counter0 }}" data-tip="{{ bar.tip }}"></rect>{% endfor %}
  </svg>
  {% if axis == "ends" %}<div class="sc-chart-axis is-ends" aria-hidden="true"><span>{{ chart.bars.0.label }}</span><span>{% with last=chart.bars|last %}{{ last.label }}{% endwith %}</span></div>{% else %}<div class="sc-chart-axis" aria-hidden="true">{% for bar in chart.bars %}<span>{{ bar.label }}</span>{% endfor %}</div>{% endif %}
  <p class="visually-hidden" id="{{ chart_id }}-hint">{% translate "Use the left and right arrow keys to read each value." %}</p>
  <details class="sc-chart-table"><summary>{% translate "See the data" %}</summary>
    <table class="table table-sm"><caption class="visually-hidden">{{ title }}</caption>
      <tbody>{% for bar in chart.bars %}<tr><th scope="row">{{ bar.label }}</th><td class="text-end">{{ bar.value }}</td></tr>{% endfor %}</tbody>
    </table>
  </details>
</figure>
