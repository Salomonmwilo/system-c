{% load i18n %}{% if status == "paid" %}<span class="sc-badge sc-badge-ok"><i class="bi bi-check2-circle" aria-hidden="true"></i>{{ label }}</span>{% elif status == "awaiting_payment" %}<span class="sc-badge sc-badge-wait"><i class="bi bi-hourglass-split" aria-hidden="true"></i>{{ label }}</span>{% elif status == "payment_pending" %}<span class="sc-badge sc-badge-wait"><i class="bi bi-search" aria-hidden="true"></i>{{ label }}</span>{% elif status == "refunded" %}<span class="sc-badge sc-badge-stop"><i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i>{{ label }}</span>{% elif status == "cancelled" %}<span class="sc-badge sc-badge-neutral"><i class="bi bi-x-circle" aria-hidden="true"></i>{{ label }}</span>{% else %}<span class="sc-badge sc-badge-neutral"><i class="bi bi-pencil" aria-hidden="true"></i>{{ label }}</span>{% endif %}
